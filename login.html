<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة الطلبات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        }

        .login-container {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-info);
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--color-info);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-login:hover {
            background-color: #1976d2;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-message {
            display: none;
            background-color: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--color-not-delivered);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
            color: var(--color-not-delivered);
            font-size: 13px;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--bg-tertiary);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .login-info {
            background-color: rgba(33, 150, 243, 0.1);
            border: 1px solid var(--color-info);
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
                margin: 20px;
            }

            .login-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body id="login-page">
    <div class="login-container">
        <div class="login-header">
            <h1>
                <i class="ri-line-chart-line" style="font-size: 32px; color: var(--color-info);"></i>
                <br>
                نظام إدارة الطلبات
            </h1>
            <p>تسجيل الدخول</p>
        </div>

        <div class="login-info">
            <strong>بيانات الاختبار:</strong><br>
            البريد: admin@example.com<br>
            كلمة السر: password123
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="error-message" id="errorMessage"></div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">دخول</span>
                <span class="loading-spinner" id="btnSpinner"></span>
            </button>
        </form>

        <div class="login-footer">
            <p>© 2026 جميع الحقوق محفوظة</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const loginBtn = document.getElementById('loginBtn');

            // Show loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const result = await Auth.login(email, password);

                if (result.success) {
                    // Redirect based on role
                    const role = result.user.role;
                    switch (role) {
                        case 'admin':
                            window.location.href = 'admin.html';
                            break;
                        case 'employee':
                        case 'store':
                            window.location.href = 'index.html';
                            break;
                        default:
                            window.location.href = 'index.html';
                    }
                } else {
                    errorMsg.textContent = result.error || 'فشل تسجيل الدخول';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = error.message || 'حدث خطأ أثناء تسجيل الدخول';
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const isLoggedIn = await Auth.init();
            if (isLoggedIn) {
                // Redirect to appropriate dashboard
                const role = Auth.currentRole;
                if (role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>
</body>
</html>
